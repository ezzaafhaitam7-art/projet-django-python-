{% extends 'base/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 mt-5">
            <div class="card-header bg-dark text-white text-center py-4">
                <h3 class="mb-0"><i class="fas fa-user-lock me-2"></i>Connexion</h3>
            </div>
            <div class="card-body p-5">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger">{{ message }}</div>
                    {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nom d'utilisateur</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Votre pseudo" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Mot de passe</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-key"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-dark btn-lg w-100 shadow-sm">Se connecter</button>
                </form>
            </div>
            <div class="card-footer bg-light text-center py-3">
                <span>Pas de compte ? <a href="{% url 'inscription' %}" class="text-primary fw-bold">S'inscrire ici</a></span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
